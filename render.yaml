services:
  - type: web
    name: plant-disease-classifier
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements-deploy.txt && python -m scripts.fetch_model_from_clearml
    startCommand: python -m app.app
    healthCheckPath: /
    envVars:
      - key: GRADIO_SERVER_NAME
        value: 0.0.0.0
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
      - key: CLEARML_API_HOST
        value: https://api.clear.ml
      - key: CLEARML_WEB_HOST
        value: https://app.clear.ml
      - key: CLEARML_FILES_HOST
        value: https://files.clear.ml
      - key: CLEARML_API_ACCESS_KEY
        sync: false
      - key: CLEARML_API_SECRET_KEY
        sync: false
    buildFilter:
      ignoredPaths:
        - documents/**
        - notebooks/**
        - configs/**
        - tests/**
        - "**/*.md"
