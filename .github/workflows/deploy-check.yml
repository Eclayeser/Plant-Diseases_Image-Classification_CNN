name: deploy-check

on:
  push:
  pull_request:
    branches: [main]

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLEARML_API_HOST: https://api.clear.ml
      CLEARML_WEB_HOST: https://app.clear.ml
      CLEARML_FILES_HOST: https://files.clear.ml
      CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
      CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-deploy.txt
      - name: Install Requirements
        run: pip install -r requirements-deploy.txt
      - name: Check torch is not installed
        run: |
          if python -c "import torch" 2>/dev/null; then
            echo "torch must not be in requirements-deploy.txt"
            exit 1
          fi
      - name: Fetch model from ClearML using model ID in model.lock.json
        run: python -m scripts.fetch_model_from_clearml
      - name: Check single and batch predictions with all configured models
        run: |
          python - <<'EOF'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PIL import Image
          from app.app import build_deployed_interfaces
          from leafapp.config import ROOT
          from leafapp.model_registry import load_model_registry

          registry = load_model_registry(ROOT / "deployment" / "model.lock.json")
          models = registry["models"]
          single, batch = build_deployed_interfaces()
          image = Image.new("RGB", (300, 200), "green")

          with TemporaryDirectory() as tmp:
              path = Path(tmp) / "leaf.png"
              image.save(path)
              for model in models:
                  name = model["name"]
                  if len(models) == 1:
                      result = single.fn(image)
                      rows = batch.fn([str(path)])
                  else:
                      result = single.fn(image, name)
                      rows = batch.fn([str(path)], name)
                  assert result and "Top 5 Predictions" in result
                  assert len(rows) == 1 and rows[0][0] == "leaf.png"
                  assert rows[0][1] and rows[0][2].endswith("%")
                  print(f"PASS: {name} (single and batch)")
          EOF
