<!-- Dependency failures present while setting up Gradio-lite template on static SDK for Hugging Face Spaces -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gradio-Lite Deployment Test</title>

    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/@gradio/lite@5.45.0/dist/lite.js">
    </script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@gradio/lite@5.45.0/dist/lite.css">
</head>

<body>
    <gradio-lite>
import gradio as gr

def preview_image(image):
    return image

demo = gr.Interface(
    fn=preview_image,
    inputs=gr.Image(type="numpy", label="Leaf Image"),
    outputs=gr.Image(label="Image Preview"),
    title="Plant Disease Classifier",
    description="Gradio-Lite deployment compatibility test."
)

demo.launch()
    </gradio-lite>
</body>
</html>
