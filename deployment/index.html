
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant Disease Classification</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f6f7f9;
      color: #242424;
      margin: 0;
      padding: 36px 16px;
    }

    main {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 2px 15px #00000010;
    }

    h1 { text-align: center; }
    .description {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .upload {
      border: 2px dashed #ccc;
      padding: 28px;
      border-radius: 12px;
      text-align: center;
    }

    #preview {
      max-width: 100%;
      max-height: 280px;
      margin-top: 16px;
      display: none;
    }

    button {
      background: #ef8737;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:disabled { opacity: .5; }

    #status { margin: 20px 0; color: #666; }
    .result { margin: 18px 0; }
    .bar {
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
      height: 22px;
      margin-top: 6px;
    }
    .fill { height: 100%; background: #ef8737; }
  </style>
</head>

<body>
  <main>
    <h1>Plant Disease Classification</h1>
    <p class="description">
      Upload a plant leaf image to identify its disease.
    </p>

    <div class="upload">
      <label for="imageInput">Upload a leaf image</label>
      <p><input type="file" id="imageInput" accept="image/*"></p>
      <img id="preview" alt="Uploaded leaf">
      <p><button id="predictBtn" disabled>Predict Disease</button></p>
    </div>

    <p id="status">Loading CNN model...</p>

    <section>
      <h2>Top 5 Predictions</h2>
      <div id="results"></div>
    </section>

    <p class="description">
      Predictions are generated by a trained CNN.
      Results are experimental.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
